!                vf toggle format=colorlevels=limited                                                                   #menu: 视频滤镜 > 开/关 动态范围限制
@                vf toggle vflip                                                                                        #menu: 视频滤镜 > 开/关 垂直翻转
SHARP            vf toggle hflip                                                                                        #menu: 视频滤镜 > 开/关 水平翻转
