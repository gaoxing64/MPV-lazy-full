%                vf toggle format:gamma=gamma2.2                                                                        #menu: 视频滤镜 > 开/关 伽马修正 2.2
^                vf toggle fps=fps=60/1.001                                                                             #menu: 视频滤镜 > 开/关 强制帧数 59.94
